services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXPOSED_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT       - in-network traffic (Jupyter/Spark/producers reach it via kafka:19092)
      # CONTROLLER      - KRaft controller quorum (no Zookeeper needed)
      # PLAINTEXT_HOST  - optional access from outside the compose network (e.g. host tools)
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_EXPOSED_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:7
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_EXPOSED_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-fit3182_db}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10

  jupyter:
    build:
      context: ./docker
      dockerfile: jupyter.Dockerfile
    restart: unless-stopped
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
      - "${SPARK_UI_PORT:-4040}:4040"
    environment:
      # Container-internal connection details — match the host/port that the
      # other services in this network are reachable at, NOT the host-exposed ports.
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      DB_NAME: ${DB_NAME:-fit3182_db}
      KAFKA_HOST: kafka
      KAFKA_PORT: "19092"
      TOPIC_A: ${TOPIC_A:-camera-events-A}
      TOPIC_B: ${TOPIC_B:-camera-events-B}
      TOPIC_C: ${TOPIC_C:-camera-events-C}
      DATA_DIR: ${DATA_DIR:-/home/student/work/data}
      WATERMARK_DELAY: ${WATERMARK_DELAY:-30 minutes}
      JOIN_WINDOW: ${JOIN_WINDOW:-45 seconds}
      JOIN_WINDOW_SECONDS: ${JOIN_WINDOW_SECONDS:-45}
      BATCH_SLEEP_A: ${BATCH_SLEEP_A:-5.0}
      BATCH_SLEEP_B: ${BATCH_SLEEP_B:-0.470779}
      BATCH_SLEEP_C: ${BATCH_SLEEP_C:-0.335227}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
    volumes:
      - ./src:/home/student/work/src
      - ./data:/home/student/work/data
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  kafka-data:
  mongo-data:
